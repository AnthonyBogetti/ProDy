version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # Install your package first so autosummary can import it
      - pip install -e .
      - pip install -r docs/requirements.txt
    pre_build:
      # Clean out any old failed attempts
      - rm -rf docs/generated/ docs/_build/
      # We use this to "kickstart" the rst files if index.rst isn't enough
      - sphinx-autogen -o docs/generated docs/*.rst

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
