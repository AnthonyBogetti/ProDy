# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Set the OS to a standard, recent version
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/conf.py

# Explicitly install the package and requirements
python:
   install:
   - requirements: docs/requirements.txt  # Installs sphinx, prody, numpy
   - method: pip
     path: .                              # Installs YOUR package (so autodoc can find it)
