version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - rm -rf docs/source/ docs/_build/
      - sphinx-apidoc -o docs/source/ prody --separate --force --module-first --no-toc

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
